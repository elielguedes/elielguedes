
name: Generate Snake

on:
  workflow_dispatch: # permite rodar manualmente
  schedule:
    - cron: "0 */12 * * *" # roda a cada 12h

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Dark
        uses: Platane/snk@v3
        with:
          github_user_name: elielguedes
          output: dist/github-contribution-grid-snake-dark.svg
          palette: github-dark   # ativa o dark theme

      - name: Push to main branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: main      # envia direto para main
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
